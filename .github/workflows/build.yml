name: Verify starter on Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build application and practice checks
        run: dotnet build TestAveragePractice.sln --configuration Release
      - name: Open the form and verify its supplied picture
        shell: pwsh
        run: ./tools/Verify-Starter.ps1
      - name: Discover all 23 practice checks
        shell: pwsh
        run: |
          $testList = dotnet test TestProject1/TestProject1.csproj --configuration Release --no-build --list-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testList | Write-Output
          $markTests = @($testList | Where-Object { $_ -match 'Mark\d{2}_' })
          if ($markTests.Count -ne 23) { throw "Expected 23 practice checks, found $($markTests.Count)." }
          "Windows build, form opening and picture loading passed. All 23 checks were discovered." >> $env:GITHUB_STEP_SUMMARY
          "The exercise is intentionally unsolved; run the checks in Visual Studio to score your attempt." >> $env:GITHUB_STEP_SUMMARY
